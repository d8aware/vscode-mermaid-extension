name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # VS Code integration tests need a display.
      - run: xvfb-run -a npm test
      - name: Audit runtime dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high
