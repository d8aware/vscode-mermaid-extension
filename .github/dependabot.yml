version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Must not exceed engines.vscode in package.json, or `vsce package` fails.
      # Bump it by hand together with engines.vscode.
      - dependency-name: "@types/vscode"
    groups:
      # One weekly PR for routine dev-tooling bumps.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      # Runtime dependencies (mermaid, ts-morph) stay as individual PRs.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
